<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>遗忘曲线背单词训练营</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha512-7pQaVkgg6H8JBSFvkpzxxEe7dBDEuDfSU/EYEYTbSsfXCMVvjJAnCmvYzu3/n6PvJEa3TBUnIFJnyGryuVKy7Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="branding">
        <h1>遗忘曲线背单词训练营</h1>
        <p>导入词表、规划复习、用多样化题型巩固记忆。</p>
      </div>
      <div class="header-actions">
        <label class="file-button" for="csv-input">导入 CSV</label>
        <input id="csv-input" type="file" accept=".csv,.tsv,.txt" hidden />
        <button id="load-sample" class="ghost">载入示例词库</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="学习配置">
        <section class="panel">
          <h2>学习设置</h2>
          <div class="field">
            <label for="daily-target">今日计划单词数</label>
            <input id="daily-target" type="number" min="5" max="200" value="25" />
          </div>
          <div class="field">
            <label for="question-mix">题型混合</label>
            <select id="question-mix" multiple size="6" aria-describedby="mix-help">
              <option value="en2zh" selected>英文选中文</option>
              <option value="zh2en" selected>中文选英文</option>
              <option value="cloze" selected>例句填空（形近词）</option>
              <option value="similar" selected>形近词辨析</option>
              <option value="pos" selected>词性判断</option>
              <option value="spelling" selected>拼写练习</option>
            </select>
            <small id="mix-help">按住 Ctrl / ⌘ 可多选或取消题型。</small>
          </div>
          <button id="start-session" class="primary" disabled>开始今日训练</button>
        </section>

        <section class="panel">
          <h2>今日进度</h2>
          <dl class="stats">
            <div><dt>已学习</dt><dd id="stat-studied">0</dd></div>
            <div><dt>待复习</dt><dd id="stat-due">0</dd></div>
            <div><dt>正确率</dt><dd id="stat-accuracy">0%</dd></div>
          </dl>
          <button id="export-progress" class="secondary" disabled>导出今日复习记录</button>
        </section>

        <section class="panel panel-info">
          <h2>使用提示</h2>
          <ul>
            <li>词库需包含 Word、POS、English Definition 等列。</li>
            <li>系统基于遗忘曲线安排复习，进度保存在浏览器。</li>
            <li>拼写题允许两次机会，第一次错误将展示音标提示。</li>
          </ul>
        </section>
      </aside>

      <section class="workspace" aria-live="polite">
        <div id="welcome" class="card">
          <h2>开始前</h2>
          <p>请导入词库或使用示例词表。系统会根据遗忘曲线自动安排复习顺序，并提供多样题型辅助记忆。</p>
        </div>

        <article id="question-card" class="card hidden" aria-hidden="true">
          <header class="card-header">
            <h2 id="question-title">题目</h2>
            <div class="tag" id="question-type-tag"></div>
          </header>
          <div class="card-body">
            <p id="question-stem" class="question-stem"></p>
            <div id="choice-container" class="choices" role="group"></div>
            <div id="spelling-container" class="hidden">
              <label for="spelling-input">请拼写单词：</label>
              <input id="spelling-input" type="text" autocomplete="off" />
              <button id="submit-spelling" class="primary">提交</button>
            </div>
          </div>
          <footer class="card-footer">
            <div id="feedback" class="feedback" aria-live="assertive"></div>
            <div id="memory-hints" class="memory-hints hidden"></div>
            <button id="next-question" class="primary" disabled>下一题</button>
          </footer>
        </article>
      </section>

      <aside class="sidebar hints" aria-label="记忆辅助">
        <section class="panel">
          <h2>形近词 / 搭配</h2>
          <div id="similar-words" class="hint-block">答题后将展示形近词及释义。</div>
        </section>
        <section class="panel">
          <h2>用法笔记</h2>
          <div id="usage-notes" class="hint-block">用法、记忆法会在答题后显示。</div>
        </section>
      </aside>
    </main>

    <template id="hint-template">
      <div class="hint-item">
        <h3></h3>
        <p></p>
      </div>
    </template>

    <script src="script.js" type="module"></script>
  </body>
</html>
